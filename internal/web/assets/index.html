<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cherry Agent Manager</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e8ee; --muted:#98a0b3; --accent:#5b9dff; --ok:#3ecf8e;
    --warn:#ffb648; --danger:#ff6b6b; --radius:10px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3ea;--fg:#1a1d24;--muted:#66708a;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
  header{padding:20px 24px 0;max-width:1080px;margin:0 auto;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  h1{font-size:19px;margin:0 0 4px;font-weight:650}
  h2{font-size:15px;margin:0 0 12px;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:0}
  main{max-width:1080px;margin:0 auto;padding:16px 24px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .kv{background:var(--panel2);border-radius:8px;padding:10px 12px}
  .kv .k{color:var(--muted);font-size:12px}
  .kv .v{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all}
  button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
    color:var(--fg);padding:7px 13px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  button.danger{border-color:#5a2b2b;color:var(--danger)}
  button.ghost{padding:5px 10px;font-size:12.5px}
  input,select,textarea{font:inherit;width:100%;background:var(--panel2);color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  textarea{min-height:130px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  label{display:block;margin-bottom:12px}
  label .lb{display:block;margin-bottom:5px;color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;
    border:1px solid var(--line);background:var(--panel2)}
  .pill.ok{color:var(--ok);border-color:#1f4d38}
  .pill.bad{color:var(--danger);border-color:#5a2b2b}
  .notice{border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;border:1px solid}
  .notice.warn{background:#2a2113;border-color:#5a441f;color:#ffd79a}
  .notice.err{background:#2a1414;border-color:#5a2b2b;color:#ffb3b3}
  .notice.ok{background:#12241c;border-color:#1f4d38;color:#9be8c4}
  @media (prefers-color-scheme: light){
    .notice.warn{background:#fff7e8}.notice.err{background:#fdeeee}.notice.ok{background:#eafaf3}
  }
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.end{justify-content:flex-end}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .langbtn{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .langbtn button{border:0;border-radius:0;padding:5px 11px;font-size:12.5px}
  .langbtn button[aria-pressed="true"]{background:var(--accent);color:#08111f;font-weight:600}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);
    padding:0;width:min(680px,92vw);max-height:88vh}
  dialog::backdrop{background:#000a}
  .dlg-body{padding:20px 22px;overflow:auto;max-height:calc(88vh - 60px)}
  .dlg-foot{padding:13px 22px;border-top:1px solid var(--line);display:flex;
    justify-content:space-between;gap:10px;align-items:center}
  .toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:9}
  .toast div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    padding:10px 14px;border-radius:8px;max-width:420px;font-size:13px;box-shadow:0 6px 24px #0006}
  .toast div.err{border-left-color:var(--danger)}
  .toast div.ok{border-left-color:var(--ok)}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Cherry Agent Manager</h1>
    <div class="sub" data-i18n="app.subtitle"></div>
  </div>
  <div class="langbtn" role="group" aria-label="Language">
    <button id="langZh" onclick="setLang('zh')">中文</button>
    <button id="langEn" onclick="setLang('en')">EN</button>
  </div>
</header>
<main>
  <div id="alerts"></div>

  <div class="card">
    <h2 data-i18n="card.env"></h2>
    <div class="grid" id="env"></div>
    <div id="asarBox" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h2 data-i18n="card.runtimes"></h2>
    <div id="runtimes"></div>
    <div id="patchBox" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0" data-i18n="card.agents"></h2>
      <div class="row">
        <button onclick="loadAll()" data-i18n="btn.refresh"></button>
        <button class="primary" onclick="openCreate()" data-i18n="btn.newAgent"></button>
      </div>
    </div>
    <div id="agents" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2 data-i18n="card.backups"></h2>
    <div id="backups"></div>
  </div>
</main>

<dialog id="dlg">
  <form id="agentForm" method="dialog">
    <div class="dlg-body">
      <h2 id="dlgTitle"></h2>
      <label><span class="lb" data-i18n="field.name"></span><input name="name" required data-i18n-ph="ph.name"></label>
      <label><span class="lb" data-i18n="field.avatar"></span><input name="avatar" placeholder="🧪" maxlength="8"></label>
      <div id="runtimeError" class="notice err" style="display:none"></div>
      <label><span class="lb" data-i18n="field.runtime"></span><select name="type" id="typeSel"></select></label>
      <label><span class="lb" data-i18n="field.model"></span><select name="model" id="modelSel"></select></label>
      <label><span class="lb" data-i18n="field.permission"></span><select name="permissionMode" id="permSel"></select></label>
      <label><span class="lb" data-i18n="field.effort"></span><select name="reasoningEffort">
        <option value="" data-i18n="effort.unset"></option>
        <option value="default">default</option><option value="low">low</option>
        <option value="medium">medium</option><option value="high">high</option>
        <option value="max" selected>max</option>
      </select></label>
      <label><span class="lb" data-i18n="field.instructions"></span><textarea name="instructions" data-i18n-ph="ph.instructions"></textarea></label>
      <label id="skipWrap" style="display:none">
        <span class="lb">
          <input type="checkbox" id="skipCheck" style="width:auto;margin-right:6px">
          <span data-i18n="field.skip"></span>
        </span>
        <span class="muted" style="font-size:12px" data-i18n="field.skipHint"></span>
      </label>
    </div>
    <div class="dlg-foot">
      <span class="muted" id="dlgHint"></span>
      <span class="row">
        <button type="button" onclick="dlg.close()" data-i18n="btn.cancel"></button>
        <button type="submit" class="primary" id="dlgSave" data-i18n="btn.save"></button>
      </span>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

let LANG = localStorage.getItem("cam.lang") || "zh";

function t(key, ...args) {
  const d = DICT[LANG] || DICT.zh;
  let s = d[key] ?? (DICT.zh[key] ?? key);
  // 用函数式替换，避免参数里出现 $& 之类的替换模式被特殊解释
  for (const a of args) s = s.replace("%s", () => String(a));
  return s;
}

// 把带 data-i18n / data-i18n-ph 的元素一次性填好
function applyStaticI18n() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById("langZh").setAttribute("aria-pressed", String(LANG === "zh"));
  document.getElementById("langEn").setAttribute("aria-pressed", String(LANG === "en"));
  document.title = "Cherry Agent Manager";
}

// 切换语言：本地立即生效，同时告诉后端，让后端返回的文案（错误、状态判定）也切过去
async function setLang(l) {
  LANG = l;
  localStorage.setItem("cam.lang", l);
  applyStaticI18n();
  try { await api("POST", "/api/config", { lang: l }); } catch (e) { /* 切语言失败不影响界面 */ }
  await loadAll();
}

/* ============================ 基础工具 ============================ */

const $ = (s, r = document) => r.querySelector(s);
let STATE = null;
let MODELS = [];
let EDITING = null;

const PERMS = {
  "default": ["default", "plan", "acceptEdits", "bypassPermissions"],
  "dsh": ["default", "plan", "acceptEdits", "bypassPermissions"],
  "pi": ["default", "acceptEdits", "bypassPermissions"],
  "claude-code": ["default", "plan", "acceptEdits", "auto", "bypassPermissions"],
};

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = kind;
  el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 9000 : 4500);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ============================ 渲染 ============================ */

function renderAlerts(st) {
  const out = [];
  if (st.running) out.push(`<div class="notice warn">${t("alert.running")}</div>`);
  if (!st.install.asarPath) out.push(`<div class="notice warn">${t("alert.noAsar")}</div>`);
  if (st.scanError) out.push(`<div class="notice err">${esc(t("alert.scanErr", st.scanError))}</div>`);
  (st.install.warnings || []).forEach(w => out.push(`<div class="notice warn">${esc(w)}</div>`));
  $("#alerts").innerHTML = out.join("");
}

function renderEnv(st) {
  const i = st.install;
  const items = [
    [t("env.dataDir"), i.dataDir],
    [t("env.version"), i.version || t("env.notDetected")],
    [t("env.asar"), i.asarPath || t("env.notFound")],
    [t("env.running"), st.running ? t("env.isRunning") : t("env.notRunning")],
    [t("env.agentCount"), String(st.agentCount)],
  ];
  $("#env").innerHTML = items.map(([k, v]) =>
    `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");
  renderAsarBox(st);
}

// app.asar 找不到时，运行时就列不出来，也就无法新建 Agent。
// 所以这里必须给一个能直接操作的入口，而不是只显示一条警告。
function renderAsarBox(st) {
  const p = st.install.asarPath || "";
  const missing = !p;
  $("#asarBox").innerHTML = `
    <div class="row" style="align-items:flex-end">
      <label style="flex:1;margin:0">
        <span class="lb">${esc(t("env.asarLabel"))}${missing ? " " + esc(t("env.asarMissingSuffix")) : ""}</span>
        <input id="asarInput" value="${esc(p)}" placeholder="${esc(t("env.asarPh"))}">
      </label>
      <button onclick="saveAsar()">${esc(t("btn.saveScan"))}</button>
      <button onclick="rescanAll()">${esc(t("btn.rescan"))}</button>
    </div>
    ${missing ? `<div class="notice warn" style="margin-top:12px">
      <b>${esc(t("env.asarMissing"))}</b><br>
      ${esc(t("env.asarMissing2"))} <code>&lt;Cherry Studio&gt;/resources/app.asar</code>。
      ${esc(t("env.asarMissing3"))}
    </div>` : ""}`;
}

function renderRuntimes(st) {
  const checks = st.runtimeChecks || [];
  if (!checks.length) {
    $("#runtimes").innerHTML = `<div class="muted">${esc(t("run.cannotList"))}</div>`;
  } else {
    $("#runtimes").innerHTML = `<table><thead><tr>
        <th>${esc(t("th.runtime"))}</th><th>${esc(t("th.type"))}</th><th>${esc(t("th.status"))}</th></tr></thead><tbody>` +
      checks.map(c => `<tr>
        <td>${esc(c.label)}</td>
        <td class="mono">${esc(c.type)}</td>
        <td>${c.hidden
          ? `<span class="pill bad">${esc(t("pill.hidden"))}</span> <span class="muted">${esc(c.verdict)}</span>`
          : `<span class="pill ok">${esc(t("pill.available"))}</span> <span class="muted">${esc(c.verdict)}</span>`}</td>
      </tr>`).join("") + `</tbody></table>`;
  }
  renderPatch(st);
}

function renderPatch(st) {
  const p = st.patchState || {};
  const box = $("#patchBox");
  const disabled = st.running ? "disabled" : "";

  if (p.applied) {
    box.innerHTML = `<div class="notice ok">${t("patch.active")}</div>
      <div class="row end"><button class="danger" ${disabled} onclick="revertPatch()">${esc(t("btn.revertPatch"))}</button></div>`;
    return;
  }
  if (!p.supported) {
    box.innerHTML = `<div class="muted">${esc(p.reason || "")}</div>`;
    return;
  }
  box.innerHTML = `
    <div class="notice warn">
      ${t("patch.what", esc(p.targetFile || ""))}
      <div class="mono" style="margin-top:8px">${esc(p.statement || "")}</div>
      <div style="margin-top:8px">${t("patch.how")}</div>
    </div>
    <div class="row end"><button class="primary" ${disabled} onclick="applyPatch()">${esc(t("btn.patch"))}</button></div>`;
}

function renderAgents(list) {
  if (!list.length) { $("#agents").innerHTML = `<div class="muted">${esc(t("agents.empty"))}</div>`; return; }
  $("#agents").innerHTML = `<table><thead><tr>
      <th>${esc(t("th.avatar"))}</th><th>${esc(t("th.name"))}</th><th>${esc(t("th.runtime"))}</th>
      <th>${esc(t("th.model"))}</th><th>${esc(t("th.orderKey"))}</th><th></th>
    </tr></thead><tbody>` + list.map(a => `<tr>
      <td>${esc(a.configuration?.avatar || "")}</td>
      <td>${esc(a.name)}</td>
      <td><span class="pill">${esc(a.type)}</span></td>
      <td class="mono">${esc(a.model)}</td>
      <td class="mono">${esc(a.orderKey)}</td>
      <td class="row end">
        <button class="ghost" onclick='openEdit(${JSON.stringify(a.id)})'>${esc(t("btn.edit"))}</button>
        <button class="ghost" onclick='dupAgent(${JSON.stringify(a.id)}, ${JSON.stringify(a.name)})'>${esc(t("btn.dup"))}</button>
        <button class="ghost danger" onclick='delAgent(${JSON.stringify(a.id)}, ${JSON.stringify(a.name)})'>${esc(t("btn.del"))}</button>
      </td>
    </tr>`).join("") + `</tbody></table>`;
}

function renderBackups(list) {
  if (!list.length) { $("#backups").innerHTML = `<div class="muted">${esc(t("backups.empty"))}</div>`; return; }
  $("#backups").innerHTML = `<table><thead><tr>
      <th>${esc(t("th.time"))}</th><th>${esc(t("th.reason"))}</th><th>${esc(t("th.files"))}</th><th></th>
    </tr></thead><tbody>` +
    list.map(b => `<tr>
      <td class="mono">${esc(new Date(b.createdAt).toLocaleString())}</td>
      <td>${esc(b.reason)}</td>
      <td class="mono">${(b.entries || []).map(e => esc(e.stored)).join(", ")}</td>
      <td class="row end"><button class="ghost" onclick='restore(${JSON.stringify(b.id)})'>${esc(t("btn.restore"))}</button></td>
    </tr>`).join("") + `</tbody></table>`;
}

async function loadAll() {
  try {
    STATE = await api("GET", "/api/status");
    renderAlerts(STATE);
    renderEnv(STATE);
    renderRuntimes(STATE);
    renderBackups(STATE.backups || []);
    const agents = await api("GET", "/api/agents");
    renderAgents(agents);
  } catch (e) { toast(e.message, "err"); }
}

/* ============================ 表单 ============================ */

async function openCreate() {
  EDITING = null;
  $("#dlgTitle").textContent = t("dlg.new");
  const f = $("#agentForm");
  f.reset();
  await prepareForm(null);
  $("#dlgHint").textContent = STATE?.running ? t("hint.running") : "";
  $("#dlg").showModal();
}

async function openEdit(id) {
  const agents = await api("GET", "/api/agents");
  const a = agents.find(x => x.id === id);
  if (!a) return;
  EDITING = a;
  $("#dlgTitle").textContent = t("dlg.edit", a.name);
  const f = $("#agentForm");
  f.name.value = a.name;
  f.avatar.value = a.configuration?.avatar || "";
  f.instructions.value = a.instructions || "";
  f.permissionMode.value = a.configuration?.permission_mode || "";
  f.reasoningEffort.value = a.configuration?.reasoning_effort || "";
  await prepareForm(a);
  $("#dlgHint").textContent = t("hint.immutable");
  $("#dlg").showModal();
}

async function prepareForm(a) {
  if (!MODELS.length) MODELS = await api("GET", "/api/models");

  const runtimes = STATE?.scan?.runtimes || [];
  const blocked = runtimes.length === 0;

  const typeSel = $("#typeSel");
  if (a) {
    typeSel.innerHTML = `<option value="${esc(a.type)}">${esc(a.type)}</option>`;
  } else if (blocked) {
    // 拿不到运行时列表时，退化成"未经验证"的单项，并要求显式勾选跳过校验。
    // 关键是：绝不把一个空的下拉框丢给用户，让他不知道为什么选不了。
    typeSel.innerHTML = `<option value="dsh">dsh${esc(t("run.unverified"))}</option>`;
  } else {
    typeSel.innerHTML = runtimes.map(r =>
      `<option value="${esc(r.type)}">${esc(r.label)}（${esc(r.type)}）${r.hidden ? esc(t("run.unlocked")) : ""}</option>`
    ).join("");
  }
  typeSel.disabled = !!a;

  const modelSel = $("#modelSel");
  modelSel.innerHTML = MODELS.map(m =>
    `<option value="${esc(m.id)}">${esc(m.id)}${m.enabled ? "" : " —"}</option>`).join("");
  if (a) modelSel.value = a.model;

  syncPerms(a ? a.type : typeSel.value);

  const showBlock = blocked && !a;
  const errBox = $("#runtimeError");
  errBox.style.display = showBlock ? "block" : "none";
  if (showBlock) {
    errBox.textContent = STATE?.scanError
      ? t("run.cannotListErr", STATE.scanError)
      : t("run.cannotList");
  }
  $("#skipWrap").style.display = showBlock ? "block" : "none";
  $("#skipCheck").checked = false;
  $("#skipCheck").onchange = updateSaveButton;

  typeSel.onchange = () => syncPerms(typeSel.value);
  updateSaveButton();
}

// 保存按钮何时可点，集中在一处判断，避免各处漏改导致按钮状态和实际能力对不上。
function updateSaveButton() {
  const running = !!STATE?.running;
  const noRuntime = !$("#typeSel").value;
  const needsSkip = $("#runtimeError").style.display === "block" && !$("#skipCheck").checked;
  $("#dlgSave").disabled = running || noRuntime || needsSkip;
}

function syncPerms(type) {
  const list = PERMS[type] || ["default", "acceptEdits", "bypassPermissions"];
  const sel = $("#permSel");
  const cur = sel.value;
  sel.innerHTML = list.map(p => `<option value="${p}">${p}</option>`).join("");
  if (list.includes(cur)) sel.value = cur;
}

$("#agentForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  const payload = {
    type: EDITING ? EDITING.type : f.type.value,
    name: f.name.value.trim(),
    description: EDITING?.description || "",
    instructions: f.instructions.value,
    model: f.model.value,
    avatar: f.avatar.value.trim(),
    permissionMode: f.permissionMode.value,
    reasoningEffort: f.reasoningEffort.value,
    skipRuntimeCheck: $("#skipCheck").checked,
  };
  if (!payload.name) { toast(t("err.nameEmpty"), "err"); return; }
  if (!payload.model) { toast(t("err.modelRequired"), "err"); return; }
  try {
    if (EDITING) await api("PUT", "/api/agents/" + EDITING.id, payload);
    else await api("POST", "/api/agents", payload);
    $("#dlg").close();
    toast(EDITING ? t("toast.saved") : t("toast.created"), "ok");
    loadAll();
  } catch (err) { toast(err.message, "err"); }
});

/* ============================ 操作 ============================ */

async function dupAgent(id, name) {
  // 默认名在界面算好再发出去——后端不知道当前语言，写死会中英混用
  try {
    await api("POST", "/api/agents/" + id + "/duplicate", { name: name + t("dup.suffix") });
    toast(t("toast.duped"), "ok"); loadAll();
  } catch (e) { toast(e.message, "err"); }
}

async function delAgent(id, name) {
  if (!confirm(t("confirm.del", name))) return;
  try { await api("DELETE", "/api/agents/" + id); toast(t("toast.deleted"), "ok"); loadAll(); }
  catch (e) { toast(e.message, "err"); }
}

async function applyPatch() {
  if (!confirm(t("confirm.patch"))) return;
  try { await api("POST", "/api/patch/apply", {}); toast(t("toast.patched"), "ok"); loadAll(); }
  catch (e) { toast(e.message, "err"); }
}

async function revertPatch() {
  try { await api("POST", "/api/patch/revert", {}); toast(t("toast.reverted"), "ok"); loadAll(); }
  catch (e) { toast(e.message, "err"); }
}

async function restore(id) {
  if (!confirm(t("confirm.restore"))) return;
  try { await api("POST", "/api/backups/" + id + "/restore", {}); toast(t("toast.restored"), "ok"); loadAll(); }
  catch (e) { toast(e.message, "err"); }
}

async function saveAsar() {
  const v = $("#asarInput").value.trim();
  if (!v) { toast(t("err.asarPathRequired"), "err"); return; }
  try {
    STATE = await api("POST", "/api/config", { asarPath: v });
    toast(t("toast.asarSaved"), "ok");
    await loadAll();
  } catch (e) { toast(e.message, "err"); }
}

async function rescanAll() {
  try { await api("POST", "/api/rescan", {}); toast(t("toast.rescanned"), "ok"); await loadAll(); }
  catch (e) { toast(e.message, "err"); }
}

/* ============================ 启动 ============================ */

applyStaticI18n();
loadAll();
</script>
</body>
</html>
